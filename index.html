    <script>
      (function () {
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var mode = dark ? "dark" : "light";
        try {
          var ap = JSON.parse(localStorage.getItem("lector:activePack") || "null");
          var v =
            (ap && localStorage.getItem(ap.ns + "Pref_theme")) ||
            (ap && ap.defaultTheme) ||
            "system";
          if (v === "system") mode = dark ? "dark" : "light";
          else mode = v === "dark" ? "dark" : "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
