<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- گرادینت وجه بالا -->
    <linearGradient id="le-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- گرادینت وجه راست -->
    <linearGradient id="le-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- ساختار ایزومتریک اصلی لوگو -->
  <g transform="translate(150, 150)">
    <!-- وجه بالا (Top Facet) -->
    <polygon points="0,-70 60,-35 0,0 -60,-35" fill="url(#le-top)" />
    
    <!-- وجه راست (Right Facet) -->
    <polygon points="0,0 60,-35 60,35 0,70" fill="url(#le-right)" />
    
    <!-- وجه چپ (Left Facet) -->
    <polygon points="-60,-35 0,0 0,70 -60,35" fill="#0284c7" />
    
    <!-- هسته مرکزی تعاملی (Inner Core) -->
    <polygon points="0,-35 30,-17.5 0,0 -30,-17.5" fill="#ffffff" />
  </g>
</svg>
